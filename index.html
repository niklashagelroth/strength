<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Styrka</title>
  <meta name="description" content="Personlig träningsdagbok för styrka, kondition och rörlighet — offline, lokalt lagrad." />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- iOS: lägg till på hemskärmen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Styrka" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <button id="back-btn" class="back-btn hidden" type="button" aria-label="Tillbaka">‹</button>
      <h1 id="view-title">Träna</h1>
    </div>
    <div id="reminder" class="reminder hidden" role="status"></div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" aria-label="Huvudnavigering">
    <button data-view="train" class="nav-btn active" type="button">
      <span class="nav-ico">🏋️</span><span>Träna</span>
    </button>
    <button data-view="routines" class="nav-btn" type="button">
      <span class="nav-ico">📋</span><span>Rutiner</span>
    </button>
    <button data-view="exercises" class="nav-btn" type="button">
      <span class="nav-ico">🗂️</span><span>Övningar</span>
    </button>
    <button data-view="stats" class="nav-btn" type="button">
      <span class="nav-ico">📊</span><span>Statistik</span>
    </button>
    <button data-view="more" class="nav-btn" type="button">
      <span class="nav-ico">⚙️</span><span>Mer</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden" role="status"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
